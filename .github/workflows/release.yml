name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-macos:
    name: Publish macOS (${{ matrix.arch_name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_name: Apple Silicon
            runner: macos-15
            rust_target: aarch64-apple-darwin
          - arch_name: Intel
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin

    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.0.8

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const tag = process.env.GITHUB_REF_NAME;
          const expectedVersion = tag.replace(/^v/, '');

          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauriConfig = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersionMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);

          if (!cargoVersionMatch) {
            throw new Error('Unable to read version from src-tauri/Cargo.toml');
          }

          const versions = {
            tag: expectedVersion,
            packageJson: packageJson.version,
            tauriConfig: tauriConfig.version,
            cargoToml: cargoVersionMatch[1],
          };

          const mismatches = Object.entries(versions).filter(([name, version]) => {
            return name !== 'tag' && version !== expectedVersion;
          });

          if (mismatches.length > 0) {
            const details = mismatches
              .map(([name, version]) => `${name}=${version}`)
              .join(', ');
            throw new Error(`Release tag ${tag} does not match app versions: ${details}`);
          }

          console.log(`Release version ${expectedVersion} verified.`);
          EOF

      - name: Load release notes from CHANGELOG.md
        run: |
          node <<'EOF'
          const fs = require('node:fs');

          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.replace(/^v/, '');
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);

          let startIndex = -1;
          let endIndex = lines.length;

          for (let i = 0; i < lines.length; i += 1) {
            const line = lines[i];
            if (line.startsWith('## ')) {
              const heading = line.slice(3).trim();
              if (startIndex === -1) {
                const matchesVersion =
                  heading === version ||
                  heading.startsWith(`${version} `) ||
                  heading === `[${version}]` ||
                  heading.startsWith(`[${version}] `);

                if (matchesVersion) {
                  startIndex = i;
                }
              } else {
                endIndex = i;
                break;
              }
            }
          }

          if (startIndex === -1) {
            throw new Error(`Unable to find release notes for version ${version} in CHANGELOG.md`);
          }

          const notes = lines.slice(startIndex, endIndex).join('\n').trim();
          const releaseBody = [
            notes,
            '',
            '## 下载说明',
            '',
            '- Apple Silicon（M 系列芯片）：推荐下载 `Port.Kill_' + version + '_aarch64.dmg`；手动解压请选择 `Port.Kill_aarch64.app.tar.gz`。',
            '- Intel 芯片：推荐下载 `Port.Kill_' + version + '_x64.dmg`；手动解压请选择 `Port.Kill_x64.app.tar.gz`。',
            '- 如果不确定芯片类型，可点击屏幕左上角的苹果菜单，选择“关于本机”查看。',
            '- `dmg` 适合大多数用户直接安装；`app.tar.gz` 是对应架构的压缩应用包，适合手动解压使用。',
            '',
            '## 安装说明',
            '',
            '1. 打开下载的 `dmg` 文件，将 `Port Kill.app` 拖入“应用程序”目录。',
            '2. 在“应用程序”中打开 Port Kill。',
            '',
            '当前发行版尚未完成 Apple 公证。从浏览器下载后，macOS 可能因无法完成来源验证而提示“已损坏，无法打开”。这类提示反映的是系统验证状态，不等同于安装包或应用文件实际损坏。',
            '',
            '遇到该提示时，请确认应用已经放入“应用程序”目录，然后打开“终端”执行：',
            '',
            '```bash',
            'xattr -dr com.apple.quarantine "/Applications/Port Kill.app"',
            'open "/Applications/Port Kill.app"',
            '```',
            '',
            '该操作会移除 macOS 为下载项添加的隔离标记。出于安全考虑，请仅对从本项目 GitHub Releases 获取的安装包执行。',
          ].join('\n');

          fs.appendFileSync(
            process.env.GITHUB_ENV,
            `RELEASE_BODY<<EOF\n${releaseBody}\nEOF\n`
          );
          EOF

      - name: Build and publish release assets
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Port Kill ${{ github.ref_name }}
          releaseBody: ${{ env.RELEASE_BODY }}
          prerelease: false
          tauriScript: pnpm tauri
          args: --target ${{ matrix.rust_target }}
